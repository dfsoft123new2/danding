<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>丹鼎问道 · 吃丹修仙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
  --ink:#e9e1cf; --lacquer:#f5efe2; --panel2:#ede4d0; --line:#cdbd9c; --line2:#b9a780;
  --bronze:#86602c; --bronze2:#a77c3e; --paper:#1d2824; --dim:#66675a; --faint:#8d8b78;
  --jade:#2c8565; --cinnabar:#b5432a; --violet:#6750b5; --azure:#2c6fae;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 6px 18px rgba(80,60,20,.10);
  --stage-bg:radial-gradient(120% 90% at 50% 38%, #fbf6ea 0%, #efe4cb 55%, #e2d4b4 100%);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0c1312; --lacquer:#121d1b; --panel2:#172623; --line:#29403a; --line2:#3a5650;
    --bronze:#c99e5e; --bronze2:#e3bd7c; --paper:#e7ddc7; --dim:#97a196; --faint:#6c7a72;
    --jade:#71c3a2; --cinnabar:#e8694a; --violet:#a994ec; --azure:#7cb8ea;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
    --stage-bg:radial-gradient(120% 90% at 50% 40%, #1b2b28 0%, #101a18 55%, #0a100f 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#0c1312; --lacquer:#121d1b; --panel2:#172623; --line:#29403a; --line2:#3a5650;
  --bronze:#c99e5e; --bronze2:#e3bd7c; --paper:#e7ddc7; --dim:#97a196; --faint:#6c7a72;
  --jade:#71c3a2; --cinnabar:#e8694a; --violet:#a994ec; --azure:#7cb8ea;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
  --stage-bg:radial-gradient(120% 90% at 50% 40%, #1b2b28 0%, #101a18 55%, #0a100f 100%);
  color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--ink); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--ink); color:var(--paper);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  font-size:15px; line-height:1.6; -webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
button{ font:inherit; color:inherit; }
.brush{ font-family:'Ma Shan Zheng','STXingkai','STKaiti','KaiTi',cursive; font-weight:400; letter-spacing:.02em; }
:focus-visible{ outline:2px solid var(--bronze2); outline-offset:2px; border-radius:6px; }

.app{ max-width:1320px; margin:0 auto; padding:12px 14px 28px; }
.top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:4px 2px 12px; flex-wrap:wrap; }
.brand{ margin:0; font-size:2.1rem; line-height:1; color:var(--bronze2); }
.top-meta{ display:flex; gap:16px; color:var(--dim); font-size:.86rem; flex-wrap:wrap; }
.top-meta b{ color:var(--paper); font-weight:600; }

.grid{ display:grid; grid-template-columns:290px minmax(0,1fr) 380px; gap:14px; align-items:start; }
.col{ background:var(--lacquer); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); min-width:0; }

/* ---------- 道身 ---------- */
.body{ padding:16px 16px 12px; display:flex; flex-direction:column; gap:14px; }
.realm-name{ display:flex; align-items:baseline; gap:8px; line-height:1; }
.realm-name .major{ font-size:2.9rem; color:var(--paper); }
.realm-name .minor{ font-size:1.5rem; color:var(--bronze2); }
.bar{ height:8px; border-radius:4px; background:var(--panel2); border:1px solid var(--line); overflow:hidden; margin-top:10px; }
.bar i{ display:block; height:100%; width:0; border-radius:3px; transition:width .25s linear; }
.bar.exp i{ background:linear-gradient(90deg, color-mix(in srgb,var(--cinnabar) 70%, transparent), var(--cinnabar)); }
.bar.wu i{ background:linear-gradient(90deg, color-mix(in srgb,var(--violet) 70%, transparent), var(--violet)); }
.bar-text{ display:flex; justify-content:space-between; gap:8px; font-size:.8rem; color:var(--dim); margin-top:4px; }
.trib-btn{
  margin-top:12px; width:100%; padding:10px 12px; border-radius:10px; cursor:pointer;
  background:color-mix(in srgb,var(--cinnabar) 16%, var(--lacquer)); border:1px solid var(--cinnabar); color:var(--cinnabar); font-weight:700;
  animation:tribPulse 1.6s ease-in-out infinite;
}
.trib-btn:disabled{ animation:none; opacity:.6; cursor:not-allowed; }
@keyframes tribPulse{ 50%{ box-shadow:0 0 0 4px color-mix(in srgb,var(--cinnabar) 22%, transparent); } }
.note{ font-size:.8rem; color:var(--dim); margin-top:6px; min-height:1.2em; }
.stats{ margin:0; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.stats > div{ background:var(--lacquer); padding:8px 10px; }
.stats dt{ font-size:.75rem; color:var(--dim); }
.stats dd{ margin:0; font-size:1.05rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stats .c-jade{ color:var(--jade); } .stats .c-azure{ color:var(--azure); } .stats .c-cin{ color:var(--cinnabar); }
.gongfa h3{ margin:0; font-size:.95rem; font-weight:600; color:var(--violet); }
.gongfa .sub{ font-size:.8rem; color:var(--dim); }
.buffs{ display:flex; flex-direction:column; gap:6px; }
.buff{ display:flex; justify-content:space-between; font-size:.82rem; padding:6px 10px; border-radius:8px; background:var(--panel2); border:1px solid var(--line2); }
.buff b{ color:var(--bronze2); font-weight:600; }
.log{ list-style:none; margin:0; padding:0; font-size:.8rem; color:var(--dim); display:flex; flex-direction:column; gap:3px; max-height:180px; overflow:hidden; }
.log li{ display:flex; gap:8px; }
.log time{ color:var(--faint); flex:none; }
.log .em{ color:var(--paper); }

/* ---------- 丹炉 ---------- */
.mini{ display:none; }
.furnace{ padding:12px; display:flex; flex-direction:column; gap:10px; }
.lines{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.line-tab{
  position:relative; padding:8px 4px; border-radius:10px; border:1px solid var(--line); background:var(--panel2);
  cursor:pointer; font-size:.9rem; display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--dim);
}
.line-tab .dot{ width:8px; height:8px; border-radius:50%; background:var(--lc); }
.line-tab small{ font-size:.7rem; color:var(--faint); }
.line-tab[aria-selected="true"]{ border-color:var(--lc); color:var(--paper); background:color-mix(in srgb,var(--lc) 12%, var(--lacquer)); }
.line-tab:disabled{ opacity:.45; cursor:not-allowed; }
.stage{
  position:relative; height:380px; border-radius:12px; overflow:hidden; background:var(--stage-bg); border:1px solid var(--line);
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
.stage canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.ding{ position:absolute; left:50%; bottom:6px; width:300px; max-width:82%; transform:translateX(-50%); pointer-events:none; filter:drop-shadow(0 8px 14px rgba(0,0,0,.35)); }
.pill-wrap{
  position:absolute; left:50%; top:30px; width:170px; height:170px; margin-left:-85px; cursor:pointer;
  display:grid; place-items:center; touch-action:none; will-change:transform;
}
.ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:5; }
.ring .ring-bg{ stroke:color-mix(in srgb,var(--paper) 10%, transparent); }
.ring .ring-hp{ stroke:var(--lc); stroke-linecap:round; transition:stroke-dashoffset .08s linear; filter:drop-shadow(0 0 4px var(--lc)); }
.pill{
  --ps:118px; width:var(--ps); height:var(--ps); border-radius:50%; position:relative;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.75) 0 4%, rgba(255,255,255,.18) 9%, transparent 20%),
    radial-gradient(circle at 44% 40%, var(--c1), var(--c2) 74%, rgba(0,0,0,.55) 100%);
  box-shadow:0 0 calc(16px + var(--gl,1) * 16px) var(--glow), inset -10px -14px 24px rgba(0,0,0,.42), inset 6px 8px 16px rgba(255,255,255,.14);
}
.pill::before{
  content:''; position:absolute; inset:9%; border-radius:50%; opacity:var(--vein,0);
  background:repeating-conic-gradient(from 20deg, rgba(255,255,255,.0) 0 14deg, rgba(255,255,255,.28) 15deg 17deg, rgba(255,255,255,0) 18deg 30deg);
  -webkit-mask:radial-gradient(circle, transparent 28%, #000 31% 64%, transparent 70%); mask:radial-gradient(circle, transparent 28%, #000 31% 64%, transparent 70%);
  animation:spin 26s linear infinite;
}
.pill.g3::after{
  content:''; position:absolute; inset:-14px; border-radius:50%; border:1px dashed color-mix(in srgb, var(--c1) 70%, transparent);
  animation:spin 9s linear infinite reverse;
}
.pill.dao{ background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.8) 0 4%, transparent 18%), conic-gradient(from 0deg, #f36, #fa3, #ee5, #5e8, #4bf, #95f, #f36); animation:spin 7s linear infinite; }
.pill.trib{
  background:radial-gradient(circle at 40% 35%, #8b7bd8, #2a1f4e 70%, #0b0716);
  box-shadow:0 0 38px rgba(140,120,255,.65), inset -10px -14px 24px rgba(0,0,0,.5);
  animation:tribFlash 2.2s steps(1) infinite;
}
@keyframes tribFlash{ 0%,100%{ filter:none; } 46%{ filter:brightness(2.2) saturate(.5); } 48%{ filter:none; } 52%{ filter:brightness(1.8); } 54%{ filter:none; } }
.pill.locked{ filter:grayscale(.8) brightness(.6); }
@keyframes spin{ to{ transform:rotate(360deg); } }
.stage.cult .pill{ filter:saturate(.7) brightness(.85); }
.floats{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.fl{ position:absolute; font-weight:700; font-size:.95rem; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.6); animation:flUp .9s ease-out forwards; color:#ffd7a8; }
.fl.gain{ font-size:1rem; animation-duration:1.3s; }
@keyframes flUp{ from{ opacity:1; transform:translate(-50%,0) scale(1); } to{ opacity:0; transform:translate(-50%,-56px) scale(.85); } }
.stage-tag{ position:absolute; left:12px; top:10px; font-size:.78rem; color:var(--dim); background:color-mix(in srgb,var(--lacquer) 70%, transparent); padding:2px 8px; border-radius:8px; border:1px solid var(--line); }
.trib-timer{ position:absolute; right:12px; top:10px; font-size:.9rem; color:var(--cinnabar); font-weight:700; }
.qiyu{
  position:absolute; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; cursor:pointer;
  border:1px solid var(--bronze2); color:#2a1a05; font-size:1.5rem; line-height:1;
  background:radial-gradient(circle at 40% 35%, #fff3c8, #e7b85a 60%, #a8742a);
  box-shadow:0 0 22px rgba(240,200,110,.9); animation:bob 2.4s ease-in-out infinite;
}
.qiyu span{ font-family:'Ma Shan Zheng','STKaiti','KaiTi',cursive; }
@keyframes bob{ 50%{ transform:translateY(-10px) rotate(6deg); } }

.pill-info{ display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; }
.nav{ height:44px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:1.4rem; color:var(--bronze2); }
.nav:hover{ border-color:var(--bronze); }
.pill-title{ text-align:center; min-width:0; }
.pill-name{ font-size:1.9rem; line-height:1.15; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pill-sub{ font-size:.82rem; color:var(--dim); }
.pill-sub b{ color:var(--lc); font-weight:600; }
.controls{ display:grid; grid-template-columns:1.3fr 1.3fr .8fr; gap:8px; }
.btn{ padding:12px 10px; border-radius:11px; border:1px solid var(--line2); background:var(--panel2); cursor:pointer; font-weight:600; font-size:.95rem; }
.btn:hover{ border-color:var(--bronze); }
.btn[aria-pressed="true"]{ background:color-mix(in srgb,var(--bronze) 22%, var(--lacquer)); border-color:var(--bronze2); color:var(--paper); }
.btn.cult[aria-pressed="true"]{ background:color-mix(in srgb,var(--jade) 22%, var(--lacquer)); border-color:var(--jade); }
.btn small{ display:block; font-weight:400; font-size:.72rem; color:var(--dim); }
.autos{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:transparent; font-size:.8rem; cursor:pointer; color:var(--dim); }
.chip[aria-pressed="true"]{ color:var(--paper); border-color:var(--jade); background:color-mix(in srgb,var(--jade) 15%, transparent); }
.hint{ margin:0; font-size:.84rem; color:var(--dim); min-height:2.6em; padding:8px 10px; border-left:2px solid var(--bronze); background:var(--panel2); border-radius:0 8px 8px 0; }

/* ---------- 卷册 ---------- */
.scroll{ display:flex; flex-direction:column; max-height:calc(100vh - 90px); position:sticky; top:12px; }
.tabs{ display:flex; border-bottom:1px solid var(--line); padding:0 6px; overflow-x:auto; flex:none; }
.tab{ padding:11px 12px 9px; border:0; background:none; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent; white-space:nowrap; font-size:.92rem; position:relative; }
.tab[aria-selected="true"]{ color:var(--paper); border-bottom-color:var(--bronze2); }
.tab .badge{ position:absolute; top:7px; right:3px; width:6px; height:6px; border-radius:50%; background:var(--cinnabar); }
.pane{ padding:12px; overflow-y:auto; flex:1; min-height:0; }
.pane[hidden]{ display:none; }
.pane h4{ margin:4px 0 8px; font-size:.86rem; font-weight:600; color:var(--bronze2); }
.pane p.lead{ margin:0 0 10px; font-size:.82rem; color:var(--dim); }
.rows{ display:flex; flex-direction:column; gap:6px; }
.row{ display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; text-align:left; width:100%; }
.row:hover{ border-color:var(--line2); }
.row.cur{ border-color:var(--lc); background:color-mix(in srgb,var(--lc) 10%, var(--panel2)); }
.row.lock{ opacity:.5; cursor:default; }
.row .sw{ width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 40% 35%, var(--c1), var(--c2)); box-shadow:0 0 6px var(--glow); }
.row .nm{ font-size:.92rem; }
.row .ds{ font-size:.74rem; color:var(--dim); }
.row .rt{ text-align:right; font-size:.78rem; color:var(--dim); white-space:nowrap; }
.row .rt b{ display:block; color:var(--paper); font-size:.86rem; font-weight:600; }
.card{ padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; }
.card .t{ font-weight:600; font-size:.93rem; }
.card .t small{ color:var(--bronze2); font-weight:400; margin-left:6px; font-size:.78rem; }
.card .d{ grid-column:1; font-size:.78rem; color:var(--dim); }
.buy{ grid-row:1 / span 2; grid-column:2; min-width:92px; padding:8px 10px; border-radius:9px; border:1px solid var(--bronze); background:color-mix(in srgb,var(--bronze) 14%, transparent); cursor:pointer; font-size:.82rem; line-height:1.3; }
.buy small{ display:block; color:var(--dim); font-size:.72rem; }
.buy:disabled{ border-color:var(--line); background:transparent; opacity:.55; cursor:not-allowed; }
.buy.max{ border-color:var(--line); opacity:.6; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:10px; }
.seg button{ border:0; background:transparent; padding:5px 12px; cursor:pointer; font-size:.8rem; color:var(--dim); }
.seg button[aria-pressed="true"]{ background:var(--panel2); color:var(--paper); }
.big-btn{ width:100%; padding:12px; border-radius:11px; border:1px solid var(--cinnabar); background:color-mix(in srgb,var(--cinnabar) 14%, transparent); color:var(--paper); cursor:pointer; font-weight:700; font-size:1rem; margin:6px 0 14px; }
.big-btn:disabled{ border-color:var(--line); background:transparent; color:var(--dim); cursor:not-allowed; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:.84rem; margin-bottom:12px; }
.kv dt{ color:var(--dim); } .kv dd{ margin:0; text-align:right; }
.ms{ font-size:.8rem; color:var(--faint); display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line); }
.ms.on{ color:var(--paper); }
.ms.on span:first-child::before{ content:'✓ '; color:var(--jade); }
.ach-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.ach{ padding:8px 10px; border-radius:9px; border:1px solid var(--line); font-size:.8rem; color:var(--faint); }
.ach b{ display:block; font-size:.88rem; color:var(--dim); font-weight:600; }
.ach.on{ border-color:var(--bronze); background:color-mix(in srgb,var(--bronze) 10%, transparent); color:var(--dim); }
.ach.on b{ color:var(--bronze2); }
.set{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.88rem; }
.set input[type=number]{ width:64px; padding:4px 6px; border-radius:7px; border:1px solid var(--line2); background:var(--panel2); color:var(--paper); font:inherit; }
.set-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.set-actions button{ padding:8px 12px; border-radius:9px; border:1px solid var(--line2); background:var(--panel2); cursor:pointer; font-size:.84rem; }
.set-actions .danger{ border-color:var(--cinnabar); color:var(--cinnabar); }
.keys{ font-size:.8rem; color:var(--dim); margin-top:14px; line-height:1.9; }
kbd{ font-family:inherit; font-size:.76rem; padding:1px 6px; border:1px solid var(--line2); border-bottom-width:2px; border-radius:5px; background:var(--panel2); color:var(--paper); }

/* ---------- 浮层 ---------- */
.toasts{ position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; z-index:50; pointer-events:none; width:min(92vw,420px); }
.toast{ padding:9px 16px; border-radius:10px; background:var(--lacquer); border:1px solid var(--bronze); color:var(--paper); font-size:.88rem; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:tIn .25s ease-out; text-align:center; }
.toast.big{ font-size:1.05rem; border-color:var(--cinnabar); }
.toast b{ color:var(--bronze2); }
@keyframes tIn{ from{ opacity:0; transform:translateY(-8px); } }
dialog{ border:1px solid var(--bronze); border-radius:14px; background:var(--lacquer); color:var(--paper); padding:18px 20px; width:min(92vw,460px); box-shadow:0 20px 60px rgba(0,0,0,.5); }
dialog::backdrop{ background:rgba(0,0,0,.55); }
dialog h3{ margin:0 0 6px; font-size:1.5rem; color:var(--bronze2); }
dialog p{ margin:6px 0; font-size:.9rem; color:var(--dim); }
dialog textarea{ width:100%; height:120px; border-radius:8px; border:1px solid var(--line2); background:var(--panel2); color:var(--paper); font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; padding:8px; }
dialog .acts{ display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
dialog .acts button{ padding:8px 16px; border-radius:9px; border:1px solid var(--line2); background:var(--panel2); cursor:pointer; }
dialog .acts .pri{ border-color:var(--bronze); background:color-mix(in srgb,var(--bronze) 18%, transparent); }

@media (max-width:1180px){
  .grid{ grid-template-columns:260px minmax(0,1fr); }
  .scroll{ grid-column:1 / -1; position:static; max-height:none; }
  .pane{ max-height:560px; }
}
@media (max-width:760px){
  .app{ padding:8px 10px 24px; }
  .grid{ grid-template-columns:1fr; gap:10px; }
  .furnace{ order:1; } .body{ order:2; } .scroll{ order:3; }
  .brand{ font-size:1.7rem; }
  .stage{ height:330px; }
  .pill-wrap{ top:22px; width:150px; height:150px; margin-left:-75px; }
  .pill{ --ps:104px; }
  .realm-name .major{ font-size:2.4rem; }
  .log{ max-height:120px; }
  .controls{ grid-template-columns:1fr 1fr .7fr; }
  .mini{ display:grid; grid-template-columns:auto 1fr; align-items:baseline; gap:2px 10px; padding:2px 2px 0; }
  .mini-realm{ font-size:1.5rem; line-height:1.1; }
  .mini-stats{ text-align:right; font-size:.8rem; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini .bar{ grid-column:1 / -1; margin-top:4px; }
  .mini .trib-btn{ grid-column:1 / -1; margin-top:6px; }
  .body .realm .trib-btn{ display:none; }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand brush">丹鼎问道</h1>
    <div class="top-meta">

/* ---------------- 数字格式 ---------------- */
const UNITS = ['', '万','亿','兆','京','垓','秭','穰','沟','涧','正','载','极','恒河沙','阿僧祇','那由他','不可思议','无量大数'];
let SCI = false;
function setSci(v) { SCI = !!v; }
function fmt(v) {
  if (v === undefined || v === null || isNaN(v)) return '0';
  if (!isFinite(v)) return '∞';
  if (v < 0) return '-' + fmt(-v);
  if (v < 1e4) return v < 100 ? (Math.round(v * 100) / 100).toString() : (v < 1000 ? v.toFixed(1).replace(/\.0$/, '') : Math.floor(v).toString());
  if (SCI) { const e = Math.floor(Math.log10(v)); return (v / Math.pow(10, e)).toFixed(2) + 'e' + e; }
  const e4 = Math.floor(Math.log10(v) / 4);
  if (e4 < UNITS.length) { const m = v / Math.pow(10, e4 * 4); return (m >= 1000 ? m.toFixed(0) : m >= 100 ? m.toFixed(1) : m.toFixed(2)) + UNITS[e4]; }
  const e = Math.floor(Math.log10(v)); return (v / Math.pow(10, e)).toFixed(2) + 'e' + e;
}
function fmtInt(v) { return v < 1e4 ? Math.floor(v).toString() : fmt(v); }
function fmtTime(s) {
  if (!isFinite(s)) return '∞';
  s = Math.max(0, s);
  if (s < 60) return s.toFixed(s < 10 ? 1 : 0) + '秒';
  if (s < 3600) return Math.floor(s / 60) + '分' + Math.floor(s % 60) + '秒';
  if (s < 86400) return Math.floor(s / 3600) + '时' + Math.floor(s % 3600 / 60) + '分';
  return Math.floor(s / 86400) + '天' + Math.floor(s % 86400 / 3600) + '时';
}

/* ---------------- 境界 ---------------- */
const MAJORS = ['炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫','真仙','玄仙','金仙','太乙','大罗','准圣','圣人','道祖'];
const MINOR4 = ['初期','中期','后期','圆满'];
const CN = ['一','二','三','四','五','六','七','八','九','十'];
const STAGES = [];
MAJORS.forEach((m, mi) => {
  const k = mi === 0 ? 9 : 4;
  for (let i = 0; i < k; i++) {
    STAGES.push({ major: mi, minor: i, last: i === k - 1,
      name: mi === 0 ? m + CN[i] + '层' : m + MINOR4[i], mname: m,
      sub: mi === 0 ? CN[i] + '层' : MINOR4[i] });
  }
});
STAGES.forEach((st, i) => { st.lam = st.major === 0 ? i * 4 / 9 : st.major * 4 + st.minor; });
const REBIRTH_STAGE = STAGES.findIndex(s => s.major === 4); // 化神初期
const MAX_STAGE = STAGES.length - 1;
function stageDmg(s) {
  const st = STAGES[Math.min(s, MAX_STAGE)];
  let d = Math.pow(CFG.DS, st.lam) * Math.pow(CFG.DM, st.major);
  if (s > MAX_STAGE) d *= Math.pow(1.3, s - MAX_STAGE);
  return d;
}
function stageNeed(s) {
  const st = STAGES[Math.min(s, MAX_STAGE)];
  let n = CFG.X0 * Math.pow(CFG.XS, st.lam) * (st.last ? 1.5 : 1);
  if (s >= MAX_STAGE) n *= Math.pow(3, s - MAX_STAGE + 1);
  return n;
}
function stageName(s) {
  if (s <= MAX_STAGE) return STAGES[s].name;
  return '道祖·' + (s - MAX_STAGE) + '重天';
}
const TRIB_NAMES = ['','筑基心魔劫','三九雷劫','六九天劫','九九化神劫','虚空劫','五行劫','大乘心火劫','九霄雷劫','飞升仙劫','玄冥寒劫','金身劫','太乙紫霄劫','大罗天劫','混元劫','圣人劫','大道劫'];

/* ---------------- 丹药线 ---------------- */
const GRADES = ['下品','中品','上品','极品'];
const ORE_GRADES = ['黄级','玄级','地级','天级'];

  wu:  { id:'wu', name:'悟道丹', res:'道悟', start:1, hue:268,

  ore: { id:'ore', name:'灵矿', res:'灵石', start:0, hue:205,
    fam:['碎灵矿','灵石矿','精金矿','玄铁矿','星辰矿','虚空晶矿','元磁矿','太阳金矿','雷晶矿','仙晶矿','玄黄矿','不朽仙金矿','紫霄晶矿','大罗晶矿','鸿蒙晶矿','造化晶矿','混沌晶矿'] },
};
const LINE_IDS = ['eff','exp','wu','ore'];
const TIERS = MAJORS.length * 4; // 68
function rebuild() {
  LINE_IDS.forEach(id => {
  const L = LINES[id], P = CFG.lines[id];
  L.tiers = [];
  for (let t = 0; t < TIERS; t++) {
    const m = Math.floor(t / 4), g = t % 4;
    if (m < L.start) { L.tiers.push(null); continue; }
    const tt = t - L.start * 4; // 本线内部序号
    L.tiers.push({ t, m, g,
      name: id === 'ore' ? ORE_GRADES[g] + L.fam[m] : GRADES[g] + L.fam[m],
      fam: L.fam[m], grade: id === 'ore' ? ORE_GRADES[g] : GRADES[g],
      hp: P.hp0 * Math.pow(CFG.HR, t),
      val: P.v0 * Math.pow(P.vr, tt) });
  }
});
}
rebuild();
function tierOf(line, t) { return LINES[line].tiers[t]; }

/* ---------------- 功法 ---------------- */
const GONGFA_BOOKS = ['长春功','青元诀','玄元心经','紫府真经','太清道经','九转玄功','混元大道经','鸿蒙造化诀'];
function gongfaName(L) {
  if (L <= 0) return '未入门';
  const b = Math.floor((L - 1) / 9), c = (L - 1) % 9;

/* ---------------- 状态 ---------------- */
function arr(n, v) { return new Array(n).fill(v); }
function newRun(S) {

  S.bld = {}; BUILDINGS.forEach(b => S.bld[b.id] = 0);
  S.line = 'eff'; S.sel = { eff: 0, exp: 0, wu: 4, ore: 0 };
  S.cult = false; S.auto = false;

}
function newState() {
  const S = { v: 1,
    reb: { n: 0, dg: 0, dgTotal: 0, tal: {} },
    ach: {},
    stats: { kills: 0, clicks: 0, time: 0, evts: 0, tribs: 0, tribFail: 0, maxStageEver: 0, fastHua: false, bestRun: 0 },
    opts: { sci: false, autoPick: false, autoCycle: false, cycCult: 8, cycRef: 8, autoBuy: false, autoTrib: false, autoRotate: false, theme: 'auto', fx: true },
    evt: null, evtTimer: 60,

}
function TL(S, id) { return (S.reb && S.reb.tal && S.reb.tal[id]) || 0; }
function TF(S, id) { return TMAP[id].f(TL(S, id)); }

/* ---------------- 派生倍率 ---------------- */
function achCount(S) { let n = 0; for (const k in S.ach) if (S.ach[k]) n++; return n; }
function rebMul(S, key) {
  let m = 1;
  for (const ms of REB_MILESTONES) if (S.reb.n >= ms.n && ms.k) { if (ms.k === key || (ms.k === 'all' && key !== 'dg')) m *= ms.v; }
  return m;
}
function buffMul(S, k) { let m = 1; for (const b of S.buffs) if (b.k === k) m *= b.v; return m; }
function achMul(S) { return 1 + ACH_BONUS * achCount(S); }
function mods(S) {
  const am = achMul(S);

    dmgMul: stageDmg(S.stage) * fabaoMul(S.bld.fabao) * TF(S, 'shenshi') * am * buffMul(S, 'dmg') * rebMul(S, 'dmg'),
    cultMul: gongfaMul(S.gf) * TF(S, 'daoti') * am * buffMul(S, 'cult') * rebMul(S, 'cult'),
    W: dingMul(S.bld.dinge) * TF(S, 'danxin') * buffMul(S, 'W') * rebMul(S, 'W'),
    hitRate: CFG.hitBase + S.bld.dihuo + TF(S, 'huoxin'),
    expMul: TF(S, 'suhui') * rebMul(S, 'exp'),
    wuMul: (1 + 0.3 * S.bld.cangjing) * TF(S, 'wuxing') * rebMul(S, 'wu'),
    oreMul: (1 + 0.25 * S.bld.lingmai) * TF(S, 'jubao') * rebMul(S, 'ore'),

}
function hitDmg(S, M) { return S.P * M.dmgMul * CFG.KD; }
function cultRate(S, M) { return S.E * M.cultMul * CFG.KC; }
function lineMul(line, M) { return line === 'eff' ? 1 : line === 'exp' ? M.expMul : line === 'wu' ? M.wuMul : M.oreMul; }

/* ---------------- 解锁 ---------------- */
function curMajor(S) { return STAGES[Math.min(S.stage, MAX_STAGE)].major; }
function unlocked(S, line, t) {

}

function killsPerSec(S, M, line, t) {
  const p = tierOf(line, t); const d = hitDmg(S, M);

  return M.hitRate / hits;
}
function gainPerSec(S, M, line, t) {

}
function bestTier(S, M, line) {

}

/* ---------------- 进阶 ---------------- */
function tribReady(S) { return S.stage < MAX_STAGE && STAGES[S.stage].last && S.exp >= stageNeed(S.stage); }
function advance(S, ev) {
  let guard = 0;

    if (S.exp < need) break;
    if (S.stage < MAX_STAGE && STAGES[S.stage].last) { S.exp = Math.min(S.exp, need); break; }
    S.exp -= need; S.stage++;

  }
}
function onStage(S, ev) {

  if (S.stage > S.stats.maxStageEver) S.stats.maxStageEver = S.stage;
  if (S.stage >= REBIRTH_STAGE && S.runTime < 1800) S.stats.fastHua = true;
  ev && ev.push({ type: 'stage', s: S.stage });
}
function gongfaUp(S, ev) {
  let g = 0;

}
function tribHP(S, toMajor) { return LINES.eff.tiers[toMajor * 4].hp * CFG.BK * TF(S, 'tianming'); }
function tribDur(S) { return CFG.tribDur; }
function startTrib(S) {

}

/* ---------------- 炼化 ---------------- */
function curHP(S, line, t) { const h = S.hp[line][t]; return h < 0 ? tierOf(line, t).hp : h; }
function onKill(S, M, line, t, n, ev) {
  const p = tierOf(line, t);

  S.stats.kills += c;
  const g = c * p.val * lineMul(line, M);
  if (line === 'eff') S.E += g;
  else if (line === 'exp') { S.exp += g; advance(S, ev); }
  else if (line === 'wu') { S.wu += g; gongfaUp(S, ev); }

}
// 一次炼化（击打），返回 {dmg, kills, gain}
function hit(S, M, ev, isClick) {
  const d = hitDmg(S, M) * (isClick ? 1 : 1);
  if (S.trib) {
    S.trib.hp -= d;
    ev && ev.push({ type: 'hit', d, trib: true });
    if (S.trib.hp <= 0) finishTrib(S, true, ev);
    return;
  }
  const line = S.line, t = S.sel[line];
  if (!unlocked(S, line, t)) return;
  let h = curHP(S, line, t) - d;
  ev && ev.push({ type: 'hit', d });
  if (h <= 0) {
    S.hp[line][t] = -1;
    const g = onKill(S, M, line, t, 1, ev);
    ev && ev.push({ type: 'kill', line, t, g });
  } else S.hp[line][t] = h;
}
function finishTrib(S, win, ev) {
  const m = S.trib.m; S.trib = null;

    S.exp -= stageNeed(S.stage); if (S.exp < 0) S.exp = 0;
    S.stage++; S.stats.tribs++; onStage(S, ev);
    ev && ev.push({ type: 'tribWin', m });
    advance(S, ev);
  } else {

    ev && ev.push({ type: 'tribFail', m });
  }
}

/* ---------------- 主循环 ---------------- */
function tick(S, dt, input, ev) {
  input = input || {};
  S.stats.time += dt; S.runTime += dt;
  if (S.tribCD > 0) S.tribCD = Math.max(0, S.tribCD - dt);
  // buffs
  if (S.buffs.length) S.buffs = S.buffs.filter(b => (b.t -= dt) > 0);
  // 自动化
  autoLogic(S, dt);
  const M = mods(S);
  // 修炼
  if (S.trib) {
    S.trib.t -= dt;
    S._acc = (S._acc || 0) + M.hitRate * dt;
    let n = 0;
    while (S._acc >= 1 && S.trib && n++ < 400) { S._acc -= 1; hit(S, M, ev); }
    if (S.trib && S.trib.t <= 0) finishTrib(S, false, ev);
  } else if (S.cult) {
    const r = cultRate(S, M);
    S.P += r * dt;
    S._acc = 0;
  } else {
    if (M.julin > 0) S.P += cultRate(S, M) * M.julin * dt;
    if (S.auto || input.hold) {
      S._acc = (S._acc || 0) + M.hitRate * dt;
      let n = 0;
      // 大批量时解析处理，避免逐次循环
      if (S._acc > 50) {
        const k = Math.floor(S._acc); S._acc -= k;
        bulkHits(S, M, k, ev);
      } else while (S._acc >= 1 && n++ < 400) { S._acc -= 1; hit(S, M, ev); }
    } else S._acc = 0;

    if (S.evtTimer <= 0) spawnEvent(S);
  }
  if (input.clicks) for (let i = 0; i < input.clicks; i++) { if (!S.cult) { S.stats.clicks++; hit(S, M, ev, true); } }

}
function bulkHits(S, M, k, ev) {
  const line = S.line, t = S.sel[line];

  const p = tierOf(line, t), d = hitDmg(S, M);
  const per = Math.max(1, Math.ceil(p.hp / d));
  let h = curHP(S, line, t);
  // 先打掉当前这颗

}
function spawnEvent(S) {

  for (const x of EVENTS) { r -= x.w; if (r <= 0) { e = x; break; } }
  S.evt = { id: e.id, t: CFG.evtLife, x: 0.15 + Math.random() * 0.7, y: 0.2 + Math.random() * 0.5 };
  const j = TL(S, 'jiyuan');

}

  const amp = 1 + 0.2 * TL(S, 'jiyuan');
  const M = mods(S);
  let msg = '';
  const E = EVENTS.find(x => x.id === id);
  if (id === 'tide') { S.buffs.push({ k: 'cult', v: 6 * amp, t: 60, name: '灵气潮汐' }); msg = '修炼法力 ×' + fmt(6 * amp) + '，持续 60 秒'; }
  else if (id === 'fire') { S.buffs.push({ k: 'dmg', v: 6 * amp, t: 60, name: '丹火暴涨' }); msg = '炼化伤害 ×' + fmt(6 * amp) + '，持续 60 秒'; }
  else if (id === 'pill') { S.buffs.push({ k: 'W', v: 3 * amp, t: 90, name: '丹方残页' }); msg = '成丹数 ×' + fmt(3 * amp) + '，持续 90 秒'; }
  else if (id === 'stone') {

    else { const g = gongfaNeed(S.gf) * 0.6 * amp; S.wu += g; gongfaUp(S, ev); msg = '获得道悟 ' + fmt(g); }
  } else if (id === 'elder') { const g = S.P * 0.25 * amp; S.P += g; msg = '法力 +' + fmt(g); }

/* ---------------- 自动化 ---------------- */
function autoLogic(S, dt) {
  const o = S.opts;

  if (o.autoTrib && TL(S, 'hufa') && tribReady(S) && !S.trib && S.tribCD <= 0) {
    const M = mods(S);
    if (hitDmg(S, M) * M.hitRate * tribDur(S) >= tribHP(S, STAGES[S.stage].major + 1) * 1.05) startTrib(S);
  }
  if (S.trib) return;
  if (o.autoCycle && TL(S, 'lingtong')) {
    const c = S.cyc; c.t += dt;
    if (c.phase === 'ref' && c.t >= o.cycRef) { c.phase = 'cult'; c.t = 0; S.cult = true; }
    else if (c.phase === 'cult' && c.t >= o.cycCult) {
      c.phase = 'ref'; c.t = 0; S.cult = false; S.auto = true;
      if (o.autoRotate && TL(S, 'zhoutian')) {
        const av = LINE_IDS.filter(l => curMajor(S) >= LINES[l].start);
        c.li = (c.li + 1) % av.length; S.line = av[c.li];
      }
    }
    if (c.phase === 'ref') { S.cult = false; S.auto = true; }
  }
  if (o.autoPick && TL(S, 'dantong')) {
    S._pickT = (S._pickT || 0) - dt;
    if (S._pickT <= 0) { S._pickT = 1; const M = mods(S); const b = bestTier(S, M, S.line); if (b >= 0) S.sel[S.line] = b; }
  }
}
function canBuy(S, id) { const b = BMAP[id]; const L = S.bld[id]; if (L >= b.max) return false; if (b.req && curMajor(S) < b.req) return false; return S.stones >= bCost(b, L); }
function buy(S, id) { if (!canBuy(S, id)) return false; const b = BMAP[id]; S.stones -= bCost(b, S.bld[id]); S.bld[id]++; return true; }
function autoBuy(S) {
  let g = 0;
  while (g++ < 50) {
    let best = null, bc = Infinity;
    for (const b of BUILDINGS) { const L = S.bld[b.id]; if (L >= b.max || (b.req && curMajor(S) < b.req)) continue; const c = bCost(b, L); if (c < bc) { bc = c; best = b; } }
    if (!best || S.stones < bc) break;
    buy(S, best.id);
  }
}

/* ---------------- 轮回 ---------------- */
function dgGain(S) {
  if (S.runMax < REBIRTH_STAGE) return 0;
  let g = 4 * Math.pow(1.24, S.runMax - REBIRTH_STAGE) * TF(S, 'lunhui') * rebMul(S, 'dg');
  return Math.floor(g);
}
function canRebirth(S) { return S.runMax >= REBIRTH_STAGE && !S.trib; }
function rebirth(S) {
  if (!canRebirth(S)) return 0;
  const g = dgGain(S);
  S.reb.n++; S.reb.dg += g; S.reb.dgTotal += g;
  if (S.stats.bestRun === 0 || S.runMax > S.stats.bestRun) S.stats.bestRun = S.runMax;
  newRun(S);
  return g;
}
function canTal(S, id) { const t = TMAP[id]; const L = TL(S, id); return S.reb.n >= 1 && L < t.max && S.reb.dg >= tCost(t, L); }
function buyTal(S, id) { if (!canTal(S, id)) return false; const t = TMAP[id]; S.reb.dg -= tCost(t, TL(S, id)); S.reb.tal[id]++; if (id === 'sushi' && S.stage < TF(S, 'sushi') && S.runTime < 1) S.stage = TF(S, 'sushi'); return true; }

/* ---------------- 成就 ---------------- */
function checkAch(S, ev) {
  S._achT = (S._achT || 0) + 1; if (S._achT % 10) return;
  for (const a of ACH) if (!S.ach[a.id] && a.test(S)) { S.ach[a.id] = 1; ev && ev.push({ type: 'ach', a }); }
}

/* ---------------- 离线 ---------------- */

/* ---------------- 弹窗 ---------------- */
function modal(html, buttons) {
  const d = $('modal');
  d.innerHTML = html + '<div class="acts"></div>';
  const acts = d.querySelector('.acts');
  for (const [label, pri, fn] of buttons) {
    const b = document.createElement('button'); b.textContent = label; if (pri) b.className = 'pri';
    b.addEventListener('click', () => { const r = fn ? fn() : undefined; if (r !== false) d.close(); });
    acts.appendChild(b);
  }
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}
function showOffline(r) {
  if (!r || r.sec < 60) return;
  const b = r.before, a = r.after; const rows = [];
  if (a.P > b.P) rows.push(['法力', '+' + fmt(a.P - b.P)]);
  if (a.E > b.E) rows.push(['吐纳', '+' + fmt(a.E - b.E)]);
  if (a.stage > b.stage) rows.push(['境界', X.stageName(b.stage) + ' → ' + X.stageName(a.stage)]);
  else if (a.exp > b.exp) rows.push(['修为', '+' + fmt(a.exp - b.exp)]);
  if (a.gf > b.gf) rows.push(['功法', X.gongfaName(a.gf)]);
  if (a.stones > b.stones) rows.push(['灵石', '+' + fmt(a.stones - b.stones)]);
  const capNote = r.used < r.sec ? `（静室上限 ${fmtT(r.used)}）` : '';
  modal(`<h3 class="brush">出关</h3><p>闭关 ${fmtT(r.sec)}${capNote}，按 ${Math.round(r.eff * 100)}% 效率修行。</p>` +
    (rows.length ? `<dl class="kv">${rows.map(x => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl>` : '<p>离开时既未修炼也未炼化，此次闭关没有收获。下次离开前开启「打坐修炼」或「自动炼化」。</p>'), [['继续修行', true]]);
  log('出关：闭关 ' + fmtT(r.sec), true);
}

  // 增益
  const bf = $('buffs'); const bk = S.buffs.map(b => b.name + Math.ceil(b.t)).join('|');
  if (bf.dataset.k !== bk) { bf.dataset.k = bk; bf.innerHTML = S.buffs.map(b => `<div class="buff"><span><b>${esc(b.name)}</b>　${b.k === 'cult' ? '修炼' : b.k === 'dmg' ? '伤害' : '成丹'} ×${fmt(b.v)}</span><span>${Math.ceil(b.t)} 秒</span></div>`).join(''); }
  // 丹药
  renderPill(M);
  // 按钮
  const bc = $('btnCult'); bc.setAttribute('aria-pressed', String(S.cult)); bc.firstChild.textContent = S.cult ? '收功' : '打坐修炼';
  bc.disabled = !!S.trib;
  const ba = $('btnAuto'); ba.setAttribute('aria-pressed', String(S.auto && !S.cult));
  $('stage').classList.toggle('cult', S.cult && !S.trib);
  // 自动化按钮状态
  $('autos').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(!!S.opts[c.dataset.opt])));
  // 奇遇
  const q = $('qiyu');
  if (S.evt) { q.hidden = false; q.style.left = (S.evt.x * 100) + '%'; q.style.top = (S.evt.y * 100) + '%'; const g = { tide: '潮', fire: '火', stone: '石', wu: '悟', elder: '传', pill: '方' }[S.evt.id]; setText('qiyuGlyph', g); q.style.opacity = Math.min(1, S.evt.t / 3).toFixed(2); }
  else q.hidden = true;
  // 徽标
  $('bdgFu').hidden = !(S.stones >= cheapestBuild());
  $('bdgLh').hidden = !((X.canRebirth(S) && S.reb.n === 0) || X.TALENTS.some(t => X.canTal(S, t.id)));
  // 提示
  setText('hint', hintText(M));
  setText('stageTag', S.trib ? '天劫降临' : S.cult ? '打坐中 · 吐纳化为法力' : (S.auto ? '自动炼化中' : '按住丹药炼化'));
}
function renderPill(M) {
  const pill = $('pill'), ring = $('ringHp'), wrap = $('pillWrap');
  if (S.trib) {
    const key = 'trib' + S.trib.m;
    if (pillKey !== key) { pillKey = key; pill.className = 'pill trib'; wrap.style.setProperty('--lc', 'var(--cinnabar)'); $('pillWrap').parentElement.style.setProperty('--lc', 'var(--cinnabar)'); setText('pName', X.TRIB_NAMES[S.trib.m]); }
    ring.style.strokeDasharray = RING_C; ring.style.strokeDashoffset = RING_C * (1 - Math.max(0, S.trib.hp / S.trib.max));
    $('pSub').innerHTML = `劫云 <b>${fmt(Math.max(0, S.trib.hp))}</b> / ${fmt(S.trib.max)}`;
    const tt = $('tribTimer'); tt.hidden = false; tt.textContent = '剩余 ' + Math.max(0, S.trib.t).toFixed(1) + ' 秒';
    return;
  }
  $('tribTimer').hidden = true;
  const l = S.line, t = S.sel[l], p = X.tierOf(l, t);
  const key = l + t;
  if (pillKey !== key) {
    pillKey = key; const c = pillColors(l, t);
    pill.className = 'pill' + (p.g === 3 ? ' g3' : '') + (p.m === 16 ? ' dao' : '');
    pill.style.setProperty('--c1', c.c1); pill.style.setProperty('--c2', c.c2); pill.style.setProperty('--glow', c.glow);
    pill.style.setProperty('--gl', String(p.g)); pill.style.setProperty('--vein', String([0, .25, .55, .9][p.g]));
    wrap.style.setProperty('--lc', LC[l]); document.querySelector('.pill-sub').style.setProperty('--lc', LC[l]);
    setText('pName', p.name);
    $('pillWrap').setAttribute('aria-label', '按住炼化' + p.name);
  }
  const un = X.unlocked(S, l, t);
  pill.classList.toggle('locked', !un);
  const hp = X.curHP(S, l, t);
  ring.style.strokeDasharray = RING_C; ring.style.strokeDashoffset = RING_C * (1 - hp / p.hp);
  const k = X.killsPerSec(S, M, l, t);
  const per = p.val * X.lineMul(l, M) * M.W;
  $('pSub').innerHTML = un ? `气血 ${fmt(hp)} / ${fmt(p.hp)} · 每炉 <b>+${fmt(per)}</b> ${X.LINES[l].res} · ${k >= 1 ? fmt(k) + ' 炉/秒' : fmt(1 / k) + ' 秒/炉'}` : `需${X.MAJORS[p.m]}境方可炼化`;
}

/* ---------------- 新手与情境提示 ---------------- */
const TIPS = [
  '修炼与炼化交替进行：炼吐纳丹涨吐纳，打坐把吐纳化成法力，法力越高炼得越快。',
  '最好的丹药通常是「刚好一击可破」的那一品——再往上打不动，往下收益少。「择优」会替你算。',
  '丹鼎让每次炼化成丹多颗，对四系丹药都生效，是最划算的扩建之一。',
  '聚灵阵让你在炼化时也能以一定比例修炼，满级后可少切换许多次。',
  '天劫有时限。渡劫前看一眼预计伤害，不足时先修炼、升法宝，再渡。',
  '奇遇会不时在丹炉上方出现，点击即可领取，十余秒后消散。',
  '轮回得到的道果可参悟天赋；自动化天赋能让你挂机时也高效修行。',
  '离开前开启修炼或自动炼化，回来时会按静室效率结算闭关收益。',
];
function hintText(M) {
  if (S.trib) return '天劫降临！保持炼化，在时限内击散劫云即可突破大境界。';
  if (X.tribReady(S)) {
    const hp = X.tribHP(S, X.curMajor(S) + 1), cap = X.hitDmg(S, M) * M.hitRate * X.tribDur(S);
    return cap >= hp ? '修为已至圆满，点击左侧「迎接天劫」突破大境界。' : '修为圆满，但火候不足以击散劫云：先打坐修炼、炼吐纳丹、扩建法宝，提升每击伤害后再渡劫。';
  }
  if (S.E === 0 && S.reb.n === 0) return '按住中间的丹药，或打开「自动炼化」，炼出第一颗吐纳丹。';
  if (S.P < 40 && !S.cult && S.reb.n === 0) return '有了吐纳，点「打坐修炼」让吐纳化为法力。法力决定每击伤害。';
  if (S.cult && S.runTime > 0 && S.E > 0 && X.cultRate(S, M) * 30 < S.P * 0.05) return '修炼进展已很慢：吐纳跟不上法力了，收功去炼化更高品的吐纳丹吧。';
  const b = X.bestTier(S, M, S.line);
  if (!S.cult && b > S.sel[S.line] && !(S.opts.autoPick && X.TL(S, 'dantong'))) return '法力已能炼化更高品丹药，点「择优」切到 ' + X.tierOf(S.line, b).name + '。';
  if (S.counts.exp.every(c => c === 0) && S.E > 5) return '切到「修为丹」炼化来积累修为，修为圆满即可突破境界。';
  if (S.stones === 0 && S.counts.ore.every(c => c === 0) && S.runTime > 90) return '切到「灵矿」开采灵石，用于扩建洞府。';
  if (S.stones >= cheapestBuild() && S.runTime < 1200 && S.reb.n === 0) return '灵石已足够扩建洞府，打开右侧「洞府」看看。';
  if (X.canRebirth(S) && S.reb.n === 0) return '已至化神，可以轮回了：舍弃今生，换取道果强化来世。也可继续冲击更高境界，道果更多。';
  return TIPS[Math.floor(Date.now() / 12000) % TIPS.length];
}

/* ---------------- 全部重建 ---------------- */
function rebuildAll() {
  X.setSci(S.opts.sci); clampSel(); pillKey = ''; puKey = ''; gfShown = -1; achShown = -1;
  buildLineTabs(); buildAutos(); renderLog(); switchTab(curTab); renderFast();
}

/* ---------------- 输入 ---------------- */
function bindInput() {
  const pw = $('pillWrap');
  pw.addEventListener('pointerdown', e => { e.preventDefault(); try { pw.setPointerCapture(e.pointerId); } catch (_) {} holding = true; holdStart = performance.now(); clickHit(); });
  const up = () => { holding = false; };
  pw.addEventListener('pointerup', up); pw.addEventListener('pointercancel', up); pw.addEventListener('lostpointercapture', up);
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clickHit(); } });
  pw.addEventListener('contextmenu', e => e.preventDefault());
  $('btnCult').addEventListener('click', () => { if (S.trib) return; S.cult = !S.cult; if (S.cult) { holding = false; } if (S.opts.autoCycle && X.TL(S, 'lingtong')) { S.cyc.phase = S.cult ? 'cult' : 'ref'; S.cyc.t = 0; } renderFast(); });
  $('btnAuto').addEventListener('click', () => { if (S.cult && !S.trib) { S.cult = false; S.auto = true; } else S.auto = !S.auto; if (S.opts.autoCycle && X.TL(S, 'lingtong') && !S.auto) { S.opts.autoCycle = false; toast('已暂停自动周天'); } renderFast(); });
  $('btnBest').addEventListener('click', pickBest);
  $('prev').addEventListener('click', () => moveTier(-1));
  $('next').addEventListener('click', () => moveTier(1));
  $('mTrib').addEventListener('click', () => $('btnTrib').click());
  $('btnTrib').addEventListener('click', () => { if (X.startTrib(S)) { log('迎接' + X.TRIB_NAMES[S.trib.m], true); toast(`${esc(X.TRIB_NAMES[S.trib.m])}降临！`, true); pillKey = ''; renderFast(); } });
  $('qiyu').addEventListener('click', () => { const r = X.claimEvent(S); if (r) { toast(`奇遇 · <b>${esc(r.name)}</b>　${esc(r.msg)}`, true); log('奇遇「' + r.name + '」' + r.msg, true); FX.burst('--bronze2', 30); renderFast(); } });
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea') || $('modal').open) return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); $('btnAuto').click(); }
    else if (k === 'c') $('btnCult').click();
    else if (k === 'q' || k === 'e') { const av = X.LINE_IDS.filter(l => X.curMajor(S) >= X.LINES[l].start); const i = av.indexOf(S.line); setLine(av[(i + (k === 'e' ? 1 : -1) + av.length) % av.length]); }
    else if (k === 'a' || k === 'arrowleft') moveTier(-1);
    else if (k === 'd' || k === 'arrowright') moveTier(1);
    else if (k === 'b') pickBest();
    else if (k === 't' && !$('btnTrib').hidden) $('btnTrib').click();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { pump(); } });
  window.addEventListener('pagehide', save);
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => setTimeout(readVars, 30));
}

/* ---------------- 启动 ---------------- */
function boot() {
  S = load();
  let off = null;
  if (S) { const away = (Date.now() - (S.last || Date.now())) / 1000; if (away > 60) off = X.offline(S, away); }
  else { S = X.newState(); S.log = []; }
  applyTheme(); readVars(); X.setSci(S.opts.sci);
  bindInput(); FX.resize(); rebuildAll();
  if (!S.log.length) log('踏入仙途。按住丹药开始炼化。', true);
  if (off) showOffline(off);
  let lastUi = 0, lastTab = 0, lastSave = performance.now();
  function frame(now) {
    pump(); flushFloats(now);
    if (now - lastUi > 120) { lastUi = now; if (structDirty) { structDirty = false; buildLineTabs(); clampSel(); } renderFast(); }
    if (now - lastTab > 300) { lastTab = now; updTab(); }
    if (now - lastSave > 15000) { lastSave = now; save(); }
    FX.frame(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(() => { if (document.hidden) pump(); }, 1000);
  window.__S = () => S;
}
boot();
})();
</script>
